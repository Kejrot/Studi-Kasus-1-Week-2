    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #797979;
            color: #333;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #222;
            font-size: 36px;
        }

        h2, h3 {

        }

        .foto {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        .foto img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #333;
        }

        .judul-tengah {
            text-align: center;
        }

        .social-media {
            text-align: center;
            margin: 25px 0;
        }

        .social-media a {
            display: inline-block;
            margin: 5px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .social-media a:hover {
            background-color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        .tanggal {
            text-align: center;
            margin-top: 30px;
            color: #666;
        }
    </style>
</head>
